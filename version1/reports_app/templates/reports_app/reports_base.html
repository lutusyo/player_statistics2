
{% extends "base.html" %}

                <!-- MESOCYCLE -->
                <div class="col-auto">

                <!-- GYM DATA DASHBOARD -->

                    </a>

                <!-- PERFORMANCE -->

                <div class="col-auto">
                    <a href="{% url 'reports_app:scouting_reports' team_id=team.id %}"

                <div class="col-auto">
                    <a href="{% url 'reports_app:statistics_list' team_id=team.id %}"
