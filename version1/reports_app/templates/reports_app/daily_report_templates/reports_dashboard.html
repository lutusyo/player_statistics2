{% extends "reports_app/reports_base.html" %}
{% load static %}

{% block reports_content %}

<style>
/* === Sticky navbar below base.html navbar === */
.sticky-nav-wrapper {
    position: fixed;
    top: 170px; /* Adjust to fit your base navbar height */
    left: 0;
    width: 100%;
    z-index: 999;
    background-color: #fff;
    padding: 10px 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Highlight active nav button */
.sticky-nav .btn.active {
    font-weight: bold;
    border-width: 2px;
}

/* Push main content down */
#content-section {
    margin-top: 130px; /* base navbar + sticky navbar height */
}


/* Sticky nav buttons */
.sticky-nav .btn {
    transition: all 0.2s ease-in-out;
}

/* Hover effect */
.sticky-nav .btn:hover,
.sticky-nav .btn.active {
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    transform: translateY(-2px);
    font-weight: 600;
}

/* Optional: stronger border for active */
.sticky-nav .btn.active {
    border-width: 2px;
}


</style>


        <div class="col-auto">
            <form method="get" class="d-flex align-items-center flex-wrap gap-1">
  
            <!-- Start Date -->
            <input
                type="date"
                name="start_date"
                class="form-control form-control-sm"
                value="{{ request.GET.start_date }}"
                title="Start Date"
            >

            <!-- End Date -->
            <input type="date"
                name="end_date"
                class="form-control form-control-sm"
                value="{{ request.GET.end_date }}"
                title="End Date"
            >

            <!-- Keep selected season -->
            <input type="hidden"
                name="season"
                value="{{ request.GET.season }}">

            <!-- Excel -->
            <button type="submit"
                formaction="{% url 'reports_app:technical_report_excel2' team.id %}"
                class="btn btn-success btn-sm" title="Download Technical Report as Excel">📊 Excel</button>

            <!-- PDF -->


                <a
                    href="{% url 'reports_app:technical_report_preview' team.id %}?start_date={{ request.GET.start_date }}&end_date={{ request.GET.end_date }}&season={{ request.GET.season }}"
                    class="btn btn-danger btn-sm"
                    target="_blank"
                >
                    👁 View Report
                </a>

                

            <!-- PowerPoint -->
            <button
                type="submit"
                formaction="{% url 'reports_app:technical_report_ppt2' team.id %}"
                class="btn btn-primary btn-sm"
                title="Download Technical Report as PowerPoint">  📽 PPT </button>

        </form>

        </div>
        <div><a href="{% url 'loans_app_v2:loan_players_list' %}">Loaned Players </a></div>


      </div>
    </div>
  </div>
</div>


{% endblock %}
