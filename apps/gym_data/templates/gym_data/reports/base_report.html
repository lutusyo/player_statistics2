{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {{ report_title }}
    </title>

    <link rel="stylesheet"
          href="{% static 'gym_data/css/gym.css' %}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="report-container">

    <div class="report-heading">

        <div>

            <span class="eyebrow">
                GYM REPORTS
            </span>

            <h1>
                {{ report_title }}
            </h1>

            <p>
                {{ report_subtitle }}
            </p>

        </div>

        <div class="header-actions">

            <a href="{% url 'gym_data:gym_report' %}"
               class="btn btn-secondary">
                All Teams
            </a>

            <a href="{% url 'gym_data:dashboard' %}"
               class="btn btn-outline">
                Dashboard
            </a>

        </div>

    </div>


    {% block report_content %}
    {% endblock %}

</div>

</body>
</html>
