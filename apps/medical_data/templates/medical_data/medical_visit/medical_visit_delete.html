{% extends "base.html" %}

{% block content %}
    <div class="container">
        <div class="alert alert-danger">
            <h4>Delete Medical Visit</h4>
            <p>Are you sure you want to delete this record?</p>

            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger">Delete</button>
                <a href="{% url 'medical_data:medical_visit_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
