{% extends "base.html" %}

{% block title %}Complete Recovery{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h3>Complete Recovery</h3>

            <p>
                Are you confirming that
                <strong>{{ plan.visit.player }}</strong>
                has fully recovered?
            </p>

            <p class="text-muted">
                All remaining planned recovery days will be
                cancelled.
            </p>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Recovery Date
                    </label>

                    <input
                        type="date"
                        name="recovery_date"
                        class="form-control"
                        value="{{ today|date:'Y-m-d' }}"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Confirm Recovery

                </button>

                <a
                    href="{% url 'medical_data:recovery_plan_detail' plan.pk %}"
                    class="btn btn-outline-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
